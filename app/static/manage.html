<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Your classes · UNC Seat Alert</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="page">
  <a class="brand" href="/"><img src="/static/icon.svg" alt=""><span>UNC Seat Alert</span></a>

  <section class="hero">
    <h1>Your watched classes</h1>
    <p>We check these every couple of minutes and email you as soon as a seat opens.</p>
  </section>

  <section class="card">
    <div class="card-head">
      <h2 id="count">Classes</h2>
      <a class="btn small secondary" href="/">+ Watch another</a>
    </div>
    <ul id="watches" class="sections"><li class="empty">Loading…</li></ul>
  </section>

  <footer>A student project, not affiliated with UNC-Chapel Hill.</footer>
</main>

<div id="notice" class="notice hidden" role="status" aria-live="polite"></div>

<script src="/static/common.js"></script>
<script>
const token = new URLSearchParams(location.search).get("token") || "";

function showEmpty(text) {
  $("count").textContent = "Classes";
  $("watches").replaceChildren(el("li", "empty", text));
}

function updateCount() {
  const n = $("watches").querySelectorAll(".section").length;
  if (!n) return showEmpty("You're not watching any classes right now.");
  $("count").textContent = n === 1 ? "1 class" : `${n} classes`;
}

function row(w) {
  const li = el("li", "section");
  const label = `${w.subject} ${w.catalog_number}-${w.section}`;

  const info = el("div", "info");
  info.append(
    el("div", "name", w.title ? `${label} · ${w.title}` : label),
    el("div", "meta", [w.schedule, w.term,
                       w.last_checked_at && `checked ${timeAgo(w.last_checked_at)}`]
                      .filter(Boolean).join(" · ")));

  const btn = el("button", "btn small secondary", "Remove");
  btn.addEventListener("click", async () => {
    btn.disabled = true;
    try {
      await api(`/api/watches/${w.id}?token=${encodeURIComponent(token)}`, { method: "DELETE" });
      li.remove();
      updateCount();
      notify(`Stopped watching ${label}.`);
    } catch (e) {
      btn.disabled = false;
      notify("Couldn't remove that class. Try again.", false);
    }
  });

  li.append(info, seatBadge(w.last_seats), btn);
  return li;
}

async function load() {
  if (!token) return showEmpty("This page needs the link from one of our emails.");
  try {
    const watches = await api("/api/watches?token=" + encodeURIComponent(token));
    $("watches").replaceChildren(...watches.map(row));
    updateCount();
  } catch {
    showEmpty("This link is invalid or expired. Use the link from your latest email.");
  }
}

load();
</script>
</body>
</html>
