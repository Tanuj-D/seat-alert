# Database migrations. The database URL comes from app/config.py (DATABASE_URL),
# not from this file.
#
#   alembic upgrade head                          apply all migrations
#   alembic revision --autogenerate -m "message"  create a migration after changing app/db.py

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
